<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C7607A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moon House">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>Moon House</title>
<link rel="stylesheet" href="app.css">
<style>
/* ===== Vài kiểu riêng của app thật (không có trong mockup) ===== */
.pill.err::before{background:radial-gradient(circle at 35% 30%,#F3A0A0,var(--red))}
.pill.off::before{background:#B8A9AF}
.pill.err{color:var(--red)}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:rgba(217,150,43,.14);border:1px solid rgba(255,255,255,.7);color:var(--amber-ink);font-size:14px;line-height:1.4}
.banner.err{background:rgba(184,50,63,.1);color:var(--red)}
.banner b{display:block;margin-bottom:2px}
.banner button{margin-top:8px;min-height:44px;padding:0 14px;border-radius:10px;background:var(--rose);color:#fff;font-weight:600}
.tile.nopic{font-size:11px;text-align:center;padding:4px;line-height:1.2}
.tile.nopic svg{width:40%;height:auto;opacity:.45;fill:var(--ink)}
.sc-img.nopic svg{width:34%;height:auto;opacity:.4;fill:var(--ink)}
.kv .val{display:flex;align-items:center;gap:8px;color:var(--ink)}
.small-note{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.4}
</style>
</head>
<body>
<!-- Màu tô cho mặt trăng hình cầu (trạng thái váy) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="mg-lit" cx="35%" cy="30%" r="78%"><stop offset="0" stop-color="#FFF3D6"/><stop offset=".5" stop-color="#F2B84B"/><stop offset="1" stop-color="#B8761A"/></radialGradient>
  <radialGradient id="mg-new" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#F7EAEE"/><stop offset="1" stop-color="#C9A9B3"/></radialGradient>
  <radialGradient id="mg-dark" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#A88793"/><stop offset="1" stop-color="#6E4F5B"/></radialGradient>
  <radialGradient id="mg-done" cx="35%" cy="30%" r="78%"><stop offset="0" stop-color="#D9F3E3"/><stop offset=".5" stop-color="#4FB07A"/><stop offset="1" stop-color="#1F6B44"/></radialGradient>
</defs></svg>
<div id="app">
  <div id="view"></div>
  <div id="menu" class="menu"></div>
  <button class="fab" id="fab" data-act="menu-toggle" aria-label="Menu"><span class="fab-core">
    <svg class="ic-dress" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 2.6c.9 2 2 3 3.4 3s2.5-1 3.4-3l1.3 5.6c-1.5.9-3.1 1.3-4.7 1.3s-3.2-.4-4.7-1.3z"/><path d="M7.3 8.9C5.6 12.4 4.4 16.1 3.9 19.9c2.6.9 5.3 1.4 8.1 1.4s5.5-.5 8.1-1.4c-.5-3.8-1.7-7.5-3.4-11-1.5.9-3.1 1.3-4.7 1.3s-3.2-.4-4.7-1.3z"/></svg>
    <svg class="ic-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </span></button>
</div>
<div id="sheet"></div>
<div id="viewer"></div>
<div id="toast"></div>
<script src="store.js"></script>
<script src="api.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
